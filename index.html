<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="CSS/style.css">
  <link rel="stylesheet" href="CSS/Avaleht.css">
  
</head>

<body class="login-page">
  <header>
    <h2 class="logo">Doversoft</h2>
    <nav class="navigation">
      <a href="kataloog.html">Avaleht</a>
      <a href="meist.html">Meist</a>
      <a href="tooted.html">Tooted</a>
      <a href="kontakt.html">Kontakt</a>
      <button class="btnLogin-popup">Logi sisse</button>
    </nav>
  </header>
  <div class="wrapper">
    <span class="icon-close">
      <ion-icon name="close"></ion-icon>
    </span>
    <div class="form-box login">
      <h2>Logi sisse</h2>
      <form action="#">
        <div class="input-box">
          <span class="icon">
            <ion-icon name="mail"></ion-icon>
          </span>
          <input type="email" required>
          <label>Email</label>
        </div>
        <div class="input-box">
          <span class="icon">
            <ion-icon name="lock-closed"></ion-icon>
          </span>
          <input type="password" required>
          <label>Parool</label>
        </div>
        <div class="remember-forgot">
          <label><input type="checkbox">Jäta meelde</label>
          <a href="#">Unustasid parooli?</a>
        </div>
        <button type="submit" class="btn">Logi sisse</button>
        <div class="login-register">
          <p>Pole kasutajat? <a href="#" class="register-link">Registreeru</a></p>
        </div>
      </form>
    </div>

    <div class="form-box register">
      <h2>Registreeru</h2>
      <form action="#">
        <div class="input-box">
          <span class="icon">
            <ion-icon name="person"></ion-icon>
          </span>
          <input type="text" required>
          <label>Kasutajatunnus</label>
        </div>
        <div class="input-box">
          <span class="icon">
            <ion-icon name="mail"></ion-icon>
          </span>
          <input type="email" required>
          <label>Email</label>
        </div>
        <div class="input-box">
          <span class="icon">
            <ion-icon name="lock-closed"></ion-icon>
          </span>
          <input type="password" required>
          <label>Parool</label>
        </div>
        <div class="remember-forgot">
          <label><input type="checkbox">Nõustun tingimustega</label>
        </div>
        <button type="submit" class="btn">Registreeru</button>
        <div class="login-register">
          <p>Juba on kasutaja? <a href="#" class="login-link">Logi sisse</a></p>
        </div>
      </form>
    </div>
  </div>
  <script src="JavaScript/script.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>

  <section class="slideshow">

    <div class="slide active">
        <img src="Images/toode1.jpg" alt="Toode 1">
        <div class="slide-info">
            <h2>Toode 1</h2>
            <p>Tootekirjeldus</p>
            <h3>0.0 €</h3>
            <button class="add-cart">Lisa korvi</button>
        </div>
    </div>

    <div class="slide">
        <img src="Images/toode2.jpg" alt="Toode 2">
        <div class="slide-info">
            <h2>Toode 2</h2>
            <p>Tootekirjeldus</p>
            <h3>0.0 €</h3>
            <button class="add-cart">Lisa korvi</button>
        </div>
    </div>

    <div class="slide">
        <img src="Images/toode3.jpg" alt="Toode 3">
        <div class="slide-info">
            <h2>Toode 3</h2>
            <p>Tootekirjeldus</p>
            <h3>0.0 €</h3>
            <button class="add-cart">Lisa korvi</button>
        </div>
    </div>
</section>
  
</body>
</html>
