<!DOCTYPE html>
<html lang="et">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doversoft</title>

    <!-- Boxicons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">

</head>

<body>

    <!-- ÜLEMINE MENÜÜRIBA -->
    <header class="header">

        <div class="header-icons">
            <!-- Menüü avamise nupp -->
            <i class="bx bx-menu" id="btn"></i>

        </div>

    </header>


    <!-- LOGO -->
    <img src="images/image.jpg" alt="Doversoft logo" width="200">


    <!-- TAUST MENÜÜ AVAMISEL -->
    <div class="overlay" id="overlay"></div>


    <!-- PAREMALT AVANEV MENÜÜ -->
    <aside class="sidebar" id="sidebar">

        <!-- SULGEMISNUPP -->
        <div class="sidebar-top">
            <i class="bx bx-x" id="close-btn"></i>
        </div>


        <!-- SISSELOGIMINE -->
        <div class="sidebar-login">
            <button class="login-btn">Logi sisse</button>
        </div>


        <!-- MENÜÜLINGID -->
        <nav>

            <ul>

                <li>
                    <a href="#">Nõud</a>
                </li>

                <li>
                    <a href="#">Toidukaubad</a>
                </li>

                <li>
                    <a href="#">Paber</a>
                </li>

                <li>
                    <a href="#">Koolitarbed</a>
                </li>

                <li>
                    <a href="#">Kontoritarbed</a>
                </li>

                <li>
                    <a href="#">Firmast</a>
                </li>

                <li>
                    <a href="#">Ostutingimused</a>
                </li>

                <li>
                    <a href="#">Kontakt</a>
                </li>

            </ul>

        </nav>


        <!-- MENÜÜ ALUMINE OSA -->
        <div class="sidebar-bottom">

            <i class="bx bx-cog"></i>

            <span>
                <i class="bx bx-globe"></i>
                Eesti keel
            </span>

        </div>

    </aside>


    <!-- JAVASCRIPT -->
    <script>

        const btn = document.querySelector('#btn');
        const closeBtn = document.querySelector('#close-btn');
        const sidebar = document.querySelector('#sidebar');
        const overlay = document.querySelector('#overlay');

        // Menüü avamine
        btn.onclick = function() {
            sidebar.classList.add('active');
            overlay.classList.add('active');
        };

        // Menüü sulgemine X-nupust
        closeBtn.onclick = function() {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
        };

        // Menüü sulgemine taustale vajutades
        overlay.onclick = function() {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
        };

    </script>

</body>
</html>
