<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h2 class="logo">Logo</h2>
    <nav class="navigation">
      <a href="leht1.html">Avaleht</a>
      <a href="#">Meist</a>
      <a href="tooted.html">Tooted</a>
      <a href="#">Kontakt</a>
      <button class="btnLogin-popup">Logi sisse</button>
    </nav>
  </header>
  <div class="wrapper">
    <span class="icon-close">
      <ion-icon name="close"></ion-icon>
    </span>
    <div class="form-box login">
      <h2>Logi sisse</h2>
      <form action="#">
        <div class="input-box">
          <span class="icon"><ion-icon name="mail"></ion-icon></span>
          <input type="email" required>
          <label>Email</label>
        </div>
        <div class="input-box">
          <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
          <input type="password" required>
          <label>Parool</label>
        </div>
        <div class="remember-forgot">
          <label><input type="checkbox">Jäta meelde</label>
          <a href="#">Unustasid parooli?</a>
        </div>
        <button type="submit" class="btn">Logi sisse</button>
        <div class="login-register">
          <p>Pole kasutajat? <a href="#" class="register-link">Registreeru</a></p>
        </div>
      </form>
    </div>
  </div>
  <script src="script.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</body>
</html>
