<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="#" class="logo">Logo</a>

        <nav>
            <a href="#">Avaleht</a>
            <a href="#">Meist</a>
            <a href="#">Tooted</a>
            <a href="#" class="active">Kontakt</a>
            <a href="#" class="login">Logi sisse</a>
        </nav>
    </header>

    <main>
        <section class="contact-box">
            <h1>Kontakt</h1>

            <p class="intro">
                Saada meile oma küsimus!
            </p>

            <form action="#" method="post">

                <input type="text" name="nimi"
                       placeholder="Teie nimi" required>

                <input type="email" name="email"
                       placeholder="Teie e-mail" required>

                <input type="tel" name="telefon"
                       placeholder="Teie telefoni number" required>

                <textarea name="kusimus"
                          placeholder="Teie küsimus..."
                          required></textarea>


                <div class="buttons">
                    <button type="submit">Saada</button>
                    <button type="reset" class="reset">Tühista</button>
                </div>

            </form>
        </section>
    </main>

</body>
</html>
