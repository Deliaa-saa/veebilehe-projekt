<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt - Doversoft</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <header>
        <a href="index.html" class="logo"><img src="Images/logo.svg" alt="Doversofti logo">Doversoft</a>

        <nav class="navigation">
            <a href="index.html">Avaleht</a>
            <a href="meist.html">Meist</a>
            <a href="tooted.html">Tooted</a>
            <a href="kontakt.html">Kontakt</a>
            <a href="index.html" class="btnLogin-popup">Logi sisse</a>
        </nav>
    </header>

    <main>

        <section class="contact-card">

            <h1>Kontakt</h1>

            <p>
                Saada meile oma küsimus!
            </p>

            <form class="contact-form" action="#" method="post">

                <input type="text" name="nimi"
                       placeholder="Teie nimi" required>

                <input type="email" name="email"
                       placeholder="Teie e-mail" required>

                <input type="tel" name="telefon"
                       placeholder="Teie telefoni number" required>

                <textarea name="kusimus"
                          placeholder="Teie küsimus..."
                          required></textarea>

                <div class="contact-buttons">
                    <button type="submit">Saada</button>
                    <button type="reset" class="reset">Tühista</button>
                </div>

            </form>

        </section>

    </main>

</body>
</html>
